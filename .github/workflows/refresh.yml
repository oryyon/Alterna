# Alterna — reîmprospătare automată a indicatorilor obiectivi (sec. 7, 8)
# Rulează săptămânal (luni, 04:00 UTC) sau manual din Actions; deschide un PR
# cu diferențele — aprobarea rămâne la maintainer (fluxul agreat în sec. 7).
name: Reîmprospătare indicatori catalog

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-indicatori
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Plasa de siguranță: un pas blocat nu ține jobul ore întregi.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependențe sistem (Qt/EGL pentru PySide6)
        # `apt-get` s-a blocat o dată pe runner (3 ore, fără ieșire), ținând
        # jobul în „in_progress” și ascunzând că testele n-au fost alease.
        # Timeout-ul face pasul să pică repede, în loc să blocheze ore.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Dependențe
        run: pip install -r requirements.txt

      - name: Reîmprospătare indicatori (popcon / Ubuntu / GitHub)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/refresh_indicators.py

      - name: Validare + rebuild catalog
        run: python tools/build_catalog.py

      - name: Suite de teste
        timeout-minutes: 30
        run: python -m pytest tests/ -q

      - name: Deschide PR cu diferențele
        # ATENȚIE — setare de repo (Settings → Actions → General → Workflow
        # permissions): „Allow GitHub Actions to create and approve pull
        # requests" trebuie să fie ACTIVAT. Fără ea, ramura e împinsă, dar
        # pasul de mai jos pică cu „GitHub Actions is not permitted to create
        # or approve pull requests" — și workflow-ul nu deschide NICIODATĂ PR,
        # fără niciun semn în interfața Actions.
        #   gh api -X PUT repos/oryyon/Alterna/actions/permissions/workflow \
        #     -F enabled=true -F can_approve_pull_request_reviews=true
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore(data): reîmprospătare indicatori"
          commit-message: "Reîmprospătare automată indicatori (popcon, stele, versiuni, repo Ubuntu)"
          branch: data/refresh-indicatori
          labels: date, automat
          body: |
            Generat automat de `tools/refresh_indicators.py`.
            Verifică în special:
            - `in_ubuntu_repos` true→false (pachete scoase din depozite);
            - liniile „?" din logul jobului — pachete noi detectate, dar
              neconfirmate automat (posibile coliziuni de nume).
