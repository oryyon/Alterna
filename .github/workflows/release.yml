# Alterna — construiește și publică AppImage-ul la crearea unui tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    # Plasa de siguranță: un pas blocat nu ține jobul ore întregi.
    timeout-minutes: 45
    # Runner FIXAT, nu „ubuntu-latest”: bundle-ul PyInstaller se leagă de
    # glibc-ul runnerului, iar „latest” a sărit pe ubuntu-26.04 (glibc 2.43),
    # producând pachete ce nu pornesc pe Ubuntu 24.04 (glibc 2.39).
    # Construim pe 24.04 → compatibil cu Ubuntu 24.04+, Debian 13, Fedora 40+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependențe sistem
        # `apt-get` s-a blocat o dată pe runner (3 ore, fără ieșire) — timeout
        # ca pasul să pică repede, nu să țină jobul blocat ore întregi.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            squashfs-tools desktop-file-utils imagemagick \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Dependențe Python
        run: pip install -r requirements.txt

      - name: Teste
        timeout-minutes: 30
        run: python -m pytest tests/ -q

      - name: Build AppImage
        run: |
          ./packaging/build_appimage.sh
          ls -lh dist/*.AppImage

      - name: Build pachet Debian
        run: |
          ./packaging/build_deb.sh
          ls -lh dist/*.deb

      - name: Verificare artifact AppImage
        run: |
          chmod +x dist/*.AppImage
          dist/Alterna-*-x86_64.AppImage --appimage-extract-and-run --selftest

      - name: Verificare pachet Debian
        run: |
          dpkg-deb --info dist/*.deb
          rm -rf /tmp/debtest && mkdir -p /tmp/debtest
          dpkg-deb --extract dist/*.deb /tmp/debtest
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --version
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --selftest

      - name: Verificare compatibilitate glibc
        # Bundle-ul PyInstaller se leagă de glibc-ul runnerului. Dacă ar cere
        # o versiune mai nouă decât ținta (2.39 = Ubuntu 24.04), pachetul nu
        # ar porni pe sistemele țintă („GLIBC_2.43 not found”) — deci nu
        # publicăm nimic. Verificarea e aici, nu la utilizator.
        run: |
          set -euo pipefail
          LIB=$(find /tmp/debtest/opt/alterna/_internal -name 'libglib-2.0.so.0' -print -quit)
          if [ -z "$LIB" ]; then
            echo "Eroare: libglib-2.0.so.0 nu e in bundle" >&2
            exit 1
          fi
          MAX=$(strings "$LIB" | grep -oE '^GLIBC_2\.[0-9]+$' | sort -V | tail -1)
          MINOR=$(echo "$MAX" | sed 's/GLIBC_2\.//')
          echo "bundle-ul cere ${MAX}; tinta e GLIBC_2.39 (Ubuntu 24.04)"
          if [ "$MINOR" -gt 39 ]; then
            echo "Eroare: bundle-ul cere ${MAX}, mai nou decat tinta GLIBC_2.39" >&2
            exit 1
          fi
          echo "Compatibilitate glibc: OK (${MAX})"

      - name: Verificare consistență versiune
        # Versiunea din metadata pachetului trebuie să coincidă cu cea
        # raportată de binar; altfel bytecode-ul vechi ajunge în bundle.
        # Sursa de adevăr este app/version.py, nu numele tag-ului.
        run: |
          set -euo pipefail
          EXPECTED=$(python -c "from app.version import VERSION; print(VERSION)")
          BIN_VER=$(QT_QPA_PLATFORM=offscreen \
            /tmp/debtest/opt/alterna/alterna --version | awk '{print $2}')
          DEB_VER=$(dpkg-deb --field dist/*.deb Version | cut -d- -f1)
          echo "așteptat=${EXPECTED} binar=${BIN_VER} pachet=${DEB_VER}"
          if [ "$BIN_VER" != "$EXPECTED" ] || [ "$DEB_VER" != "$EXPECTED" ]; then
            echo "Eroare: versiunea din bundle nu coincide cu cea din sursă" >&2
            exit 1
          fi
          echo "Versiuni consistente: ${BIN_VER}"

      - name: Catalog pentru actualizarea din aplicație
        # Catalogul compilat e publicat și ca asset, ca „Actualizează
        # catalogul" din aplicație să-l poată descărca și verifica cu
        # SHA-256 (sec. 7: catalogul e un produs generat, nu se editează).
        run: |
          set -euo pipefail
          python tools/build_catalog.py
          cp catalog.db dist/catalog.db
          cd dist && sha256sum catalog.db > catalog.db.sha256
          cat catalog.db.sha256
          ls -lh catalog.db catalog.db.sha256

      - name: Publicare release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/catalog.db
            dist/catalog.db.sha256
          generate_release_notes: true
