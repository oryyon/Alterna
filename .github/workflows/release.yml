# Alterna — construiește și publică AppImage-ul la crearea unui tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependențe sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools desktop-file-utils imagemagick \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Dependențe Python
        run: pip install -r requirements.txt

      - name: Teste
        run: python -m pytest tests/ -q

      - name: Build AppImage
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_appimage.sh

      - name: Build pachet Debian
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_deb.sh

      - name: Verificare artifact AppImage
        run: |
          ls -lh *.AppImage
          chmod +x *.AppImage
          ./Alterna-*-x86_64.AppImage --appimage-extract-and-run --selftest

      - name: Verificare pachet Debian
        run: |
          ls -lh *.deb
          dpkg-deb --info *.deb
          rm -rf /tmp/debtest && mkdir -p /tmp/debtest
          dpkg-deb --extract *.deb /tmp/debtest
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --version
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --selftest

      - name: Publicare release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.deb
          generate_release_notes: true
