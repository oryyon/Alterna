# Alterna — construiește și publică AppImage-ul la crearea unui tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependențe sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools desktop-file-utils imagemagick \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Dependențe Python
        run: pip install -r requirements.txt

      - name: Teste
        run: python -m pytest tests/ -q

      - name: Build AppImage
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_appimage.sh
          ls -lh dist/*.AppImage

      - name: Build pachet Debian
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_deb.sh
          ls -lh dist/*.deb

      - name: Verificare artifact AppImage
        run: |
          chmod +x dist/*.AppImage
          dist/Alterna-*-x86_64.AppImage --appimage-extract-and-run --selftest

      - name: Verificare pachet Debian
        run: |
          dpkg-deb --info dist/*.deb
          rm -rf /tmp/debtest && mkdir -p /tmp/debtest
          dpkg-deb --extract dist/*.deb /tmp/debtest
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --version
          QT_QPA_PLATFORM=offscreen /tmp/debtest/opt/alterna/alterna --selftest

      - name: Verificare consistență versiune
        # Versiunea din metadata pachetului trebuie să coincidă cu cea
        # raportată de binar; altfel bytecode-ul vechi ajunge în bundle.
        run: |
          set -euo pipefail
          EXPECTED="${VERSION#v}"
          BIN_VER=$(QT_QPA_PLATFORM=offscreen \
            /tmp/debtest/opt/alterna/alterna --version | awk '{print $2}')
          DEB_VER=$(dpkg-deb --field dist/*.deb Version | cut -d- -f1)
          echo "așteptat=${EXPECTED} binar=${BIN_VER} pachet=${DEB_VER}"
          if [ "$BIN_VER" != "$EXPECTED" ] || [ "$DEB_VER" != "$EXPECTED" ]; then
            echo "Eroare: versiunea din bundle nu coincide cu cea din sursă" >&2
            exit 1
          fi
          echo "Versiuni consistente: ${BIN_VER}"

      - name: Publicare release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
