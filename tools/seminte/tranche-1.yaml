# Semințe pentru import — Tranche 1 (extindere 100 → 168)
#
# Ce e aici: părțile EDITORIALE (descriere în română, categorie, alternative,
# etichete, preț, formate). Ce e obiectiv (anul primei versiuni, site-ul
# oficial, dezvoltatorul, licența) e luat de `tools/import_apps.py` din
# Wikidata, cu sursa citată în fișierul rezultat.
#
# Reguli:
# - `alternatives` referă doar id-uri care există în catalog (validat la build);
# - `telemetry` rămâne estimare editorială (doar aplicațiile cu politică
#   verificată primesc `manual`, prin `tools/check_telemetry.py`);
# - `romanian_language` e corectat de `tools/check_ro.py` doar cu dovezi;
# - `popularity` = poziția editorială în catalog (multiplu de 10; cu cât e mai
#   mică, cu atât aplicația e mai prominentă). Valorile sunt interpolate pe
#   scara catalogului, ca noile intrări să se intercaleze printre cele existente.

