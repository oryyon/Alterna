# Aceste 7 aplicații există în special ca **echivalente** pentru aplicațiile
# care nu aveau nicio alternativă în catalog (copyq, filezilla, gparted,
# syncthing, timeshift, virtualbox): clipboard, transfer de fișiere,
# partiționare, sincronizare, backup, hipervizor.
#
# `popularity` = poziția editorială în catalog (multiplu de 10; cu cât e mai
# mică, cu atât aplicația e mai prominentă).

