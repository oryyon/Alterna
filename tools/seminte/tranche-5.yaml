# Semințe pentru import — Tranche 5 (catalogul 262 → 300)
#
# Focusul: cele mai subțiri categorii după tranche-4 — Notițe 15, Producție
# audio 15, Internet 17, Comunicare 17, Grafică 18, Video 18, Audio & Playere
# 18, Dezvoltare 20. După acest tranche: Notițe 22, Producție audio 22,
# Internet 22, Comunicare 22, Grafică 22, Video 22, Audio & Playere 21,
# Dezvoltare 23 — toate peste 20.
#
# Ca la tranche-urile anterioare: aici sunt părțile EDITORIALE (descriere în
# română, categorie, alternative, etichete, preț, formate, popularitate) și
# matricea de FUNCȚIONALITĂȚI (cheile din `data/taxonomy/<categorie>.yaml`);
# datele obiective (licență, site, dezvoltator, anul primei versiuni, repo)
# vin din Wikidata prin `tools/import_apps.py`, cu sursa citată.
#
# `popularity` = poziția editorială (multiplu de 10).
# `wikidata_qid` = entitatea fixată manual, ca importul să nu se lovească de
# omonime (ex. „Vivaldi” = un cognome, „Reason” = nuvela lui Asimov).
# Valorile `features` sunt `free | paid | partial | 'no' | unknown`.
# ATENȚIE YAML: `no`/`yes` se scriu cu ghilimele ('no'), altfel devin booleeni.


